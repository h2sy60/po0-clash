name: Windows validation

on:
  pull_request:
    paths:
      - '.github/workflows/windows-validation.yaml'
      - 'scripts/windows/**'
      - 'windows/packaging/**'
      - 'windows/po0-clash-signing.cer'
      - 'plugins/setup/setup_hooks/**'
      - 'plugins/rust_api/rust/**'
      - 'services/helper/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Test build hooks
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          if ($LASTEXITCODE -ne 0) { throw 'Build hook dependencies failed.' }
          dart analyze
          if ($LASTEXITCODE -ne 0) { throw 'Build hook analysis failed.' }
          dart test --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Build hook tests failed.' }

      - name: Test native Windows IPC and Helper
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed.' }
          cargo +1.95.0 test --locked --manifest-path plugins/rust_api/rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Windows IPC tests failed.' }
          cargo +1.95.0 test --locked --manifest-path services/helper/Cargo.toml --features windows-service
          if ($LASTEXITCODE -ne 0) { throw 'Windows Helper tests failed.' }

      - name: Ensure Inno Setup is available
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }

      - name: Validate signing, installation and uninstallation with fixtures
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: ./scripts/windows/test-signing.ps1
